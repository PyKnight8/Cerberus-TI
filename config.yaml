scheduler:
  enabled: true
  update_on_start: true
  update_interval_minutes: 60
policy:
  max_age_days: 7
  expiration_days: 7
  sources:
    urlhaus:
      enabled: true
      allow_unknown_confidence: true  # Explicit trust in online URLhaus evidence.
      min_confidence: 80
    threatfox:
      enabled: true
      allow_unknown_confidence: false
      min_confidence: 80
allowlist:
  domains: []  # Entries protect the exact name AND its subdomains.
providers:
  urlhaus:
    enabled: true
  threatfox:
    enabled: true
    days: 7
http:
  timeout_seconds: 30
  total_timeout_seconds: 120
  max_response_bytes: 52428800
  max_records: 200000
logging:
  level: INFO
