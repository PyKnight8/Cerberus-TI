scheduler:
  enabled: true
  update_on_start: true
  update_interval_minutes: 60
policy:
  max_age_days: 7
  expiration_days: 7
  otx:
    enabled: false
    official_author_only: true
    max_age_days: 30
  sources:
    urlhaus:
      enabled: true
      allow_unknown_confidence: true  # Explicit trust in online URLhaus evidence.
      min_confidence: 80
    otx:
      enabled: true
      allow_unknown_confidence: false
      min_confidence: 80
    threatfox:
      enabled: true
      allow_unknown_confidence: false
      min_confidence: 80
allowlist:
  domains: []  # Entries protect the exact name AND its subdomains.
enrichment:
  cache_ttl_hours: 24
providers:
  otx:
    enabled: false
    max_pages: 100
    retrieval_strategy: auto
    endpoint_cooldown_minutes: 360
    page_size: 10
    initial_lookback_days: 90  # Set null to include full history.
    transient_retries: 2
    retry_backoff_seconds: 5
    incremental: true
    overlap_minutes: 5
    http:
      connect_timeout_seconds: 10
      read_timeout_seconds: 120
      total_timeout_seconds: 180
  urlhaus:
    enabled: true
  threatfox:
    enabled: true
    days: 7
http:
  timeout_seconds: 30
  total_timeout_seconds: 120
  max_response_bytes: 52428800
  max_records: 200000
logging:
  level: INFO

# Supply local MMDB files yourself; no downloads or external lookups are performed.
geoip:
  enabled: true
  country_database: /data/geoip/GeoLite2-Country.mmdb
  asn_database: /data/geoip/GeoLite2-ASN.mmdb
  batch_size: 250
